<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes REST API client project">
  <title>QuickNotes — API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">REST API learning project</p>
      <h1>QuickNotes</h1>
      <p class="intro">Create and manage notes with a simple API-powered interface.</p>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Ready. Load notes to get started.</p>

    <section class="panel">
      <h2>Create a note</h2>
      <form id="note-form">
        <div class="field">
          <label for="title-input">Title (required, maximum 100 characters)</label>
          <input id="title-input" name="title" type="text" maxlength="100" required placeholder="e.g. Study plan">
        </div>
        <div class="field">
          <label for="body-input">Note</label>
          <textarea id="body-input" name="body" rows="4" placeholder="Write your note here..."></textarea>
        </div>
        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section>
      <div class="section-heading">
        <h2>Your notes</h2>
        <button id="load-btn" class="secondary" type="button">Load notes</button>
      </div>
      <ul id="notes-list" aria-live="polite"></ul>
    </section>

    <footer>Demo powered by JSONPlaceholder. Changes are not permanently saved by the demo API.</footer>
  </main>
</body>
</html>
